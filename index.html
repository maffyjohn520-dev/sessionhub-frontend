<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>SessionHub</title>
</head>
<body>
  <h1>SessionHub Frontend</h1>
  <button onclick="ping()">Ping Backend</button>

  <p id="result">Waiting...</p>

  <script>
const API_URL = "https://sessionhub-backend-production.up.railway.app/";

async function ping() {
  const resultEl = document.getElementById("result");
  resultEl.innerText = "Pinging backend...";

  try {
    const res = await fetch(API_URL, { method: "GET" });
    if (!res.ok) throw new Error(`HTTP error! Status: ${res.status}`);
    const text = await res.text();
    resultEl.innerText = text;
  } catch (err) {
    resultEl.innerText = "Error contacting backend!";
    console.error(err);
  }
}
  </script>
</body>
</html>
