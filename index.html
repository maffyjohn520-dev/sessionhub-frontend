<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8" />
  <title>SessionHub</title>
</head>
<body>
  <h1>SessionHub Frontend</h1>
  <button onclick="ping()">Ping Backend</button>

  <p id="result"></p>

  <script>
    const API_URL = const API_URL = "https://sessionhub-backend-production.up.railway.app";

      const res = await fetch(API_URL);
      const text = await res.text();
      document.getElementById("result").innerText = text;
    }
  </script>
</body>
</html>
