<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>SessionHub</title>
</head>
<body>
  <h1>SessionHub Frontend</h1>
  <button onclick="ping()">Ping Backend</button>

  <p id="result">Waiting...</p>

  <script>
    const API_URL = "https://sessionhub-backend-production-f73b.up.railway.app/";

    async function ping() {
      try {
        const res = await fetch(API_URL);
        const text = await res.text();
        document.getElementById("result").innerText = text;
      } catch (err) {
        document.getElementById("result").innerText = "Failed to respond";
        console.error(err);
      }
    }
  </script>
</body>
</html>
