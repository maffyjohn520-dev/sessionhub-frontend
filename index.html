<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SessionHub Frontend</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      text-align: center;
      margin-top: 50px;
    }
    button {
      padding: 10px 20px;
      font-size: 16px;
      cursor: pointer;
    }
    #result {
      margin-top: 20px;
      font-weight: bold;
      color: #333;
    }
  </style>
</head>
<body>
  <h1>SessionHub Frontend</h1>
  <button onclick="ping()">Ping Backend</button>
  <p id="result">Waiting...</p>

  <script>
    // ✅ Use your Railway backend URL here
    const API_URL = "https://sessionhub-backend-production-f73b.up.railway.app";

    async function ping() {
      try {
        const res = await fetch(API_URL);
        const text = await res.text();
        document.getElementById("result").innerText = text;
      } catch (err) {
        document.getElementById("result").innerText = "Error connecting to backend";
        console.error(err);
      }
    }
  </script>
</body>
</html>
