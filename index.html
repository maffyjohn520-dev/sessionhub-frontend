<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8" />
  <title>SessionHub</title>
</head>
<body>
  <h1>SessionHub Frontend</h1>
  <button onclick="ping()">Ping Backend</button>

  <p id="result"></p>

  <script>
    const API_URL = "https://sessionhub-backend-production.up.railway.app";

    async function ping() {
      try {
        const res = await fetch(API_URL);
        const text = await res.text();
        document.getElementById("result").innerText = text;
      } catch (err) {
        document.getElementById("result").innerText = "Backend not reachable!";
      }
    }
  </script>
</body>
</html>
